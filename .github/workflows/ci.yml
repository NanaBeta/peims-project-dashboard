name: PEIMS verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install demo and enterprise test dependencies
        run: python -m pip install -r requirements.txt -r requirements-api.txt pytest httpx
      - name: Run analytics, project controls, API security and Streamlit smoke tests
        run: python -m pytest tests/ -q
      - name: Compile check
        run: python -m compileall -q app.py analytics.py visuals.py workflow.py project_controls.py enterprise/
      - name: Test offline static preview
        run: node scripts/test_preview.js
